<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f1f0f"/>
  <line x1="80" y1="372" x2="720" y2="372" stroke="#1a3a1a" stroke-width="2"/>

  <!-- Plank — side view, forearm plank, subtle breathing pulse -->

  <!-- Ideal alignment guide: dashed straight line from shoulder to heel,
       so any sag/pike in the animated body reads against a fixed reference -->
  <line x1="305" y1="270" x2="580" y2="368" stroke="rgba(187,247,208,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Subtle glow under body -->
  <line x1="280" y1="360" x2="580" y2="360" stroke="rgba(74,222,128,0.10)" stroke-width="18" stroke-linecap="round">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>

  <!-- Forearm on ground (fixed) -->
  <line x1="280" y1="315" x2="240" y2="348" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <line x1="240" y1="348" x2="218" y2="356" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="214" cy="358" rx="11" ry="6" fill="#4ade80"/>

  <!-- Elbow (fixed) -->
  <circle cx="280" cy="315" r="7" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3"/>

  <!-- Upper arm (elbow to shoulder — shoulder has subtle breathing motion) -->
  <line x1="280" y1="315" x2="305" stroke="#4ade80" stroke-width="9" stroke-linecap="round">
    <animate attributeName="y2" values="272;268;272" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>

  <!-- Shoulder -->
  <circle cx="305" r="8" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3">
    <animate attributeName="cy" values="272;268;272" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>

  <!-- Torso (shoulder to hip) — thick, reads as body mass -->
  <line x1="305" x2="490" stroke="#4ade80" stroke-width="15" stroke-linecap="round">
    <animate attributeName="y1" values="272;268;272" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="282;278;282" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>

  <!-- Hip -->
  <circle cx="490" r="8" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3">
    <animate attributeName="cy" values="282;278;282" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>

  <!-- Upper leg -->
  <line x1="490" x2="540" stroke="#4ade80" stroke-width="10" stroke-linecap="round">
    <animate attributeName="y1" values="282;278;282" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="325;322;325" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <circle cx="540" r="7" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3">
    <animate attributeName="cy" values="325;322;325" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>

  <!-- Lower leg (to foot on ground) -->
  <line x1="540" x2="580" y2="368" stroke="#4ade80" stroke-width="10" stroke-linecap="round">
    <animate attributeName="y1" values="325;322;325" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <ellipse cx="583" cy="370" rx="15" ry="6" fill="#4ade80"/>

  <!-- Head — eye + nose face left -->
  <g>
    <circle cx="295" r="24" fill="#4ade80">
      <animate attributeName="cy" values="248;244;248" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
    <circle cx="279" r="3.5" fill="#0f1f0f">
      <animate attributeName="cy" values="245;241;245" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
    <path fill="#4ade80">
      <animate attributeName="d" values="M273,253 Q263,255 271,261 Z;M273,249 Q263,251 271,257 Z;M273,253 Q263,255 271,261 Z" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </path>
  </g>

  <!-- HOLD text with pulse -->
  <text x="400" y="220" fill="#86efac" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="4">
    HOLD
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </text>
</svg>
