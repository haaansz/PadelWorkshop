<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f1f0f"/>
  <line x1="80" y1="372" x2="720" y2="372" stroke="#1a3a1a" stroke-width="2"/>

  <!-- Superman Hold — prone, arms+legs raise up and down -->

  <!-- Belly/core on ground (fixed pivot point) -->
  <ellipse cx="400" cy="345" rx="60" ry="8" fill="rgba(74,222,128,0.12)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </ellipse>

  <!-- Torso — belly stays planted on the ground; only the chest and hip -->
  <!-- ends of the arch lift, so the two segments meet at a fixed belly point. -->
  <line x1="340" x2="375" y2="345" stroke="#4ade80" stroke-width="15" stroke-linecap="round">
    <animate attributeName="y1" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <line x1="425" y1="345" x2="460" stroke="#4ade80" stroke-width="15" stroke-linecap="round">
    <animate attributeName="y2" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>

  <!-- Shoulder joints -->
  <circle cx="340" r="7" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3">
    <animate attributeName="cy" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <!-- Hip joints -->
  <circle cx="460" r="7" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="3">
    <animate attributeName="cy" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>

  <!-- Left arm — upper (shoulder to elbow) -->
  <line x1="340" x2="290" stroke="#4ade80" stroke-width="8" stroke-linecap="round">
    <animate attributeName="y1" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="325;280;325" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <circle cx="290" r="6" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="2.5">
    <animate attributeName="cy" values="325;280;325" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <!-- Left arm — lower (elbow to hand) -->
  <line x1="290" x2="240" stroke="#4ade80" stroke-width="8" stroke-linecap="round">
    <animate attributeName="y1" values="325;280;325" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="315;255;315" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <!-- Left hand -->
  <ellipse cx="235" rx="11" ry="6" fill="#4ade80" transform="rotate(-15 235 310)">
    <animate attributeName="cy" values="313;253;313" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </ellipse>

  <!-- Right leg — upper (hip to knee) -->
  <line x1="460" x2="520" stroke="#4ade80" stroke-width="9" stroke-linecap="round">
    <animate attributeName="y1" values="335;310;335" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="330;290;330" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <circle cx="520" r="6" fill="#0f1f0f" stroke="#bbf7d0" stroke-width="2.5">
    <animate attributeName="cy" values="330;290;330" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </circle>
  <!-- Right leg — lower (knee to foot) -->
  <line x1="520" x2="575" stroke="#4ade80" stroke-width="9" stroke-linecap="round">
    <animate attributeName="y1" values="330;290;330" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <animate attributeName="y2" values="325;270;325" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </line>
  <!-- Right foot -->
  <ellipse cx="580" rx="13" ry="6" fill="#4ade80">
    <animate attributeName="cy" values="323;268;323" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </ellipse>

  <!-- Head — eye + nose face left, rises with the arch -->
  <g>
    <circle cx="320" r="22" fill="#4ade80">
      <animate attributeName="cy" values="320;290;320" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
    <circle cx="304" r="3.5" fill="#0f1f0f">
      <animate attributeName="cy" values="316;286;316" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </circle>
    <path fill="#4ade80">
      <animate attributeName="d" values="M298,326 Q288,328 296,334 Z;M298,296 Q288,298 296,304 Z;M298,326 Q288,328 296,334 Z" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    </path>
  </g>

  <!-- Lift arrows — bolder, curved -->
  <g opacity="0.6">
    <path d="M255,290 Q235,270 245,240" stroke="#bbf7d0" stroke-width="3" fill="none" stroke-dasharray="6 4" stroke-linecap="round"/>
    <polygon points="238,244 242,228 253,240" fill="#bbf7d0"/>
    <path d="M555,310 Q578,290 568,262" stroke="#bbf7d0" stroke-width="3" fill="none" stroke-dasharray="6 4" stroke-linecap="round"/>
    <polygon points="561,266 564,250 575,261" fill="#bbf7d0"/>
  </g>
</svg>
